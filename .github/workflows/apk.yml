name: Construire l'APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Construire
        run: |
          unzip -o FootAnalyse-Android.zip
          cd FootAnalyse
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FootAnalyse-apk
          path: FootAnalyse/app/build/outputs/apk/debug/app-debug.apk
