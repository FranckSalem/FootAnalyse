name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Construire l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pvc=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk FootAnalyse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FootAnalyse-apk
          path: FootAnalyse.apk

      # Lien de téléchargement direct, sans connexion à GitHub :
      # https://github.com/FranckSalem/FootAnalyse/releases/latest/download/FootAnalyse.apk
      - name: Publier l'APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FootAnalyse.apk \
            --target "$GITHUB_SHA" \
            --title "Foot Analyse 1.${{ github.run_number }}" \
            --notes "Ouvrez ce lien sur votre téléphone, téléchargez FootAnalyse.apk puis touchez le fichier pour l'installer."
